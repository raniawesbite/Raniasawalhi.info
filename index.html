<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Rania Sawalhi — Educational Leadership</title>
<meta name="description" content="Dr. Rania Sawalhi — educational leadership researcher and practitioner. Publications, awards, initiatives, training, and speaking availability.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E3; --paper-alt:#EEE4CF; --card:#FCF9F2;
  --ink:#2B2420; --ink-soft:#5B5044; --ink-faint:#8C7B68;
  --gold:#C6871F; --gold-deep:#96650F;
  --teal:#2F5D50; --teal-deep:#1F4238; --rust:#A8442E;
  --line: rgba(43,36,32,0.16); --line-strong: rgba(43,36,32,0.28);
  --radius: 10px; --maxw: 1120px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;}
img{max-width:100%; display:block;}
a{color:inherit;}
h1,h2,h3,h4{font-family:'Fraunces', serif; font-weight:600; line-height:1.15; margin:0; letter-spacing:-0.01em;}
html[dir="rtl"] body{font-family:'Tajawal', sans-serif;}
html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3, html[dir="rtl"] h4{font-family:'Amiri', serif; font-weight:700;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px;}
.eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal-deep);}
html[dir="rtl"] .eyebrow{font-family:'IBM Plex Sans Arabic', sans-serif; letter-spacing:0;}
.lede{color:var(--ink-soft); font-size:17px; max-width:60ch;}
.marginalia{font-family:'Kalam', cursive; color:var(--rust); font-size:15px; line-height:1.3; transform:rotate(-2.5deg); display:inline-block;}
html[dir="rtl"] .marginalia{transform:rotate(2.5deg);}

header{position:sticky; top:0; z-index:50; background:rgba(246,240,227,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
nav{display:flex; align-items:center; justify-content:space-between; padding:14px 32px; max-width:var(--maxw); margin:0 auto; gap:20px;}
.logo{font-family:'Fraunces', serif; font-weight:600; font-size:18px; text-decoration:none; color:var(--ink); white-space:nowrap;}
html[dir="rtl"] .logo{font-family:'Amiri', serif;}
.logo span{color:var(--gold-deep); font-weight:400; font-size:14px; display:block; font-family:'IBM Plex Mono',monospace; letter-spacing:.03em;}
html[dir="rtl"] .logo span{font-family:'IBM Plex Sans Arabic', sans-serif;}
.navlinks{display:flex; gap:18px; list-style:none; margin:0; padding:0; align-items:center; flex-wrap:wrap;}
.navlinks a{text-decoration:none; font-size:13.5px; color:var(--ink-soft); font-weight:500; border-bottom:1px solid transparent; padding-bottom:2px; white-space:nowrap; cursor:pointer;}
.navlinks a:hover{color:var(--ink); border-color:var(--gold);}
.btn{display:inline-flex; align-items:center; gap:8px; font-family:'Inter', sans-serif; font-weight:600; font-size:14.5px; padding:10px 20px; border-radius:6px; text-decoration:none; cursor:pointer; border:1px solid transparent;}
.btn-primary{background:var(--teal); color:#F6F0E3;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink); background:var(--paper-alt);}
.navlinks .btn{padding:8px 16px; font-size:13px;}
.langswitch{display:flex; border:1px solid var(--line-strong); border-radius:20px; overflow:hidden; margin-inline-start:6px;}
.langswitch button{font-family:'IBM Plex Mono', monospace; font-size:12px; padding:6px 12px; border:none; background:transparent; cursor:pointer; color:var(--ink-soft);}
.langswitch button.active{background:var(--teal); color:#F6F0E3;}

.hero{padding:56px 0 0;}
.hero-panel{background:var(--teal-deep);}
.hero-grid{display:grid; grid-template-columns:0.85fr 1.15fr; gap:0; align-items:stretch;}
.hero-photo-wrap{background:var(--paper-alt); display:flex; align-items:center; justify-content:center; padding:40px;}
.hero-photo{width:100%; aspect-ratio:3/4; border-radius:4px; background:linear-gradient(160deg, #D9CBAE 0%, var(--teal) 130%); position:relative; overflow:hidden;}
.hero-photo img{width:100%; height:100%; object-fit:cover;}
.hero-photo .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(246,240,227,0.75); font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.1em; text-transform:uppercase;}
.hero-text{padding:56px; color:#F1ECDD;}
.hero-text .eyebrow{color:#9FC2B7;}
.hero-text h1{font-size:32px; color:#F6F0E3; margin:14px 0 18px;}
.hero-text .lede{color:#C9DCD5; font-size:16.5px;}
.hero-stats{display:flex; flex-wrap:wrap; gap:26px; margin-top:26px; padding-top:22px; border-top:1px dashed rgba(241,236,221,0.25);}
.hero-stat b{display:block; font-family:'Fraunces', serif; font-size:22px; color:#F6F0E3;}
html[dir="rtl"] .hero-stat b{font-family:'Amiri', serif;}
.hero-stat span{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#9FC2B7; text-transform:uppercase; letter-spacing:.04em;}
a.hero-stat{cursor:pointer;}
a.hero-stat:hover b{color:var(--gold);}
html[dir="rtl"] .hero-stat span{font-family:'IBM Plex Sans Arabic', sans-serif;}
.hero-ctas{display:flex; gap:14px; flex-wrap:wrap; margin-top:28px;}
.hero-text .btn-primary{background:var(--gold); color:#241a06;}
.hero-text .btn-primary:hover{background:#B37A1B;}
.hero-text .btn-ghost{color:#F6F0E3; border-color:rgba(241,236,221,0.4);}
.hero-text .btn-ghost:hover{background:rgba(241,236,221,0.1); border-color:#F6F0E3;}

section{padding:84px 0;}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:40px; flex-wrap:wrap;}
.section-head h2{font-size:30px; margin-top:8px;}

.about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:60px;}
.pull{font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:21px; line-height:1.45; color:var(--teal-deep); border-left:3px solid var(--gold); padding-left:22px; margin:26px 0;}
html[dir="rtl"] .pull{font-family:'Amiri', serif; font-style:normal; border-left:none; border-right:3px solid var(--gold); padding-left:0; padding-right:22px;}
.creds{list-style:none; margin:24px 0 0; padding:0; display:grid; gap:10px;}
.creds li{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); display:flex; gap:10px;}
html[dir="rtl"] .creds li{font-family:'IBM Plex Sans Arabic', sans-serif;}
.creds li b{color:var(--ink); font-weight:500; min-width:90px;}
.creds a{color:var(--gold-deep); text-decoration:none; font-weight:500;}
.creds a:hover{text-decoration:underline;}

.awards-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
.award-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; display:flex; gap:16px; align-items:flex-start;}
.award-year{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--gold-deep); font-weight:500; min-width:44px;}
html[dir="rtl"] .award-year{font-family:'IBM Plex Sans Arabic', sans-serif;}
.award-title{font-weight:600; font-size:15.5px; margin-bottom:4px;}
.award-note{color:var(--ink-faint); font-size:13.5px;}

.init-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
.init-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px;}
.init-card .role-tag{font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-deep); background:rgba(47,93,80,0.09); padding:4px 9px; border-radius:4px; display:inline-block; margin-bottom:12px;}
html[dir="rtl"] .init-card .role-tag{font-family:'IBM Plex Sans Arabic', sans-serif;}
.init-card h3{font-size:18px; margin-bottom:8px;}
.init-card p{color:var(--ink-soft); font-size:14.5px; margin:0;}

.pos-list{list-style:none; margin:0; padding:0;}
.pos-row{display:grid; grid-template-columns:190px 1fr; gap:24px; padding:22px 0; border-top:1px dashed var(--line-strong);}
.pos-row:last-child{border-bottom:1px dashed var(--line-strong);}
.pos-dates{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-faint); padding-top:3px;}
html[dir="rtl"] .pos-dates{font-family:'IBM Plex Sans Arabic', sans-serif;}
.pos-title{font-size:16.5px; font-weight:600; margin-bottom:3px;}
.pos-org{color:var(--gold-deep); font-size:13.5px; font-weight:500; margin-bottom:8px;}
.pos-desc{color:var(--ink-soft); font-size:14.5px; margin:0;}
.training-stat{background:var(--teal-deep); color:#F1ECDD; border-radius:var(--radius); padding:28px 32px; margin-top:34px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
.training-stat b{font-family:'Fraunces', serif; font-size:30px; color:#F6F0E3; display:block;}
html[dir="rtl"] .training-stat b{font-family:'Amiri', serif;}
.training-stat span{color:#C9DCD5; font-size:14.5px;}

.pub-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
.tag{font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal-deep); background:rgba(47,93,80,0.09); padding:4px 9px; border-radius:4px; display:inline-block;}
html[dir="rtl"] .tag{font-family:'IBM Plex Sans Arabic', sans-serif;}
.card h3{font-size:17.5px; margin:14px 0 8px; line-height:1.3;}
.card .venue{color:var(--ink-faint); font-size:13.5px; margin-bottom:10px;}
.pub-list{list-style:none; margin:36px 0 0; padding:0;}
.pub-row{display:grid; grid-template-columns:1fr auto; gap:16px; padding:16px 0; border-top:1px solid var(--line); align-items:baseline;}
.pub-row .p-title{font-size:14.5px; color:var(--ink); font-weight:500;}
.pub-row .p-venue{font-size:13px; color:var(--ink-faint); display:block; margin-top:2px;}
.pub-row .p-year{font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--gold-deep); white-space:nowrap;}
html[dir="rtl"] .pub-row .p-year{font-family:'IBM Plex Sans Arabic', sans-serif;}

.media-sub{margin-bottom:14px;}
.media-sub h3{font-size:20px;}
.video-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:48px;}
.video-card{text-decoration:none; color:var(--ink); display:block;}
.video-thumb{aspect-ratio:16/9; border-radius:8px; margin-bottom:10px; position:relative; background:linear-gradient(135deg, var(--teal) 0%, #1F4238 60%, #16302A 100%); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.video-thumb img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
.video-thumb .play{width:46px; height:46px; border-radius:50%; background:rgba(246,240,227,0.92); display:flex; align-items:center; justify-content:center; position:relative; z-index:1;}
.video-thumb .play::after{content:""; border-style:solid; border-width:8px 0 8px 13px; border-color:transparent transparent transparent var(--teal-deep); margin-left:3px;}
.video-card h4{font-size:15px; font-weight:600; line-height:1.35; margin-bottom:4px;}
.video-card .meta{font-size:12.5px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace;}
html[dir="rtl"] .video-card .meta{font-family:'IBM Plex Sans Arabic', sans-serif;}
.elsewhere{display:flex; gap:14px; flex-wrap:wrap;}
.chip{display:flex; align-items:center; gap:9px; padding:10px 16px; border:1px solid var(--line-strong); border-radius:24px; text-decoration:none; color:var(--ink); font-size:14px; font-weight:500; background:var(--card);}
.chip:hover{background:var(--paper-alt);}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--gold);}

.events-panel{background:var(--teal-deep); color:#F1ECDD; border-radius:14px; padding:48px;}
.events-panel h2{color:#F6F0E3;}
.events-panel .lede{color:#C9DCD5;}
.consult-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:34px;}
.consult-card{background:rgba(241,236,221,0.06); border:1px solid rgba(241,236,221,0.16); border-radius:10px; padding:22px;}
.consult-card h4{color:#F6F0E3; font-size:16px; margin-bottom:8px;}
.consult-card p{color:#B9CFC7; font-size:13.5px; margin:0;}
.book-cta{margin-top:38px; padding-top:32px; border-top:1px dashed rgba(241,236,221,0.25); display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap;}
.book-cta p{color:#C9DCD5; max-width:44ch; margin:8px 0 0;}

footer{padding:64px 0 40px; border-top:1px solid var(--line);}
.footer-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:56px;}
.contact-form{display:grid; gap:14px;}
.contact-form input, .contact-form textarea{font-family:'Inter', sans-serif; font-size:14.5px; padding:12px 14px; border:1px solid var(--line-strong); border-radius:7px; background:var(--card); color:var(--ink);}
html[dir="rtl"] .contact-form input, html[dir="rtl"] .contact-form textarea{font-family:'Tajawal', sans-serif;}
.contact-form textarea{min-height:100px; resize:vertical;}
.contact-form input:focus, .contact-form textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
.contact-form .row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.social-row{display:flex; gap:14px; margin-top:18px; flex-wrap:wrap;}
.social-row a{padding:0 16px; height:38px; border-radius:20px; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:13px; font-weight:500;}
.social-row a:hover{background:var(--paper-alt);}
.footer-bottom{margin-top:56px; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--ink-faint);}

.modal-overlay{position:fixed; inset:0; background:rgba(43,36,32,0.55); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card); border-radius:14px; max-width:460px; width:100%; padding:34px; position:relative; box-shadow:0 20px 60px rgba(43,36,32,0.3);}
.modal-close{position:absolute; top:16px; inset-inline-end:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-faint);}
.modal h3{font-size:22px; margin-bottom:6px;}
.modal p.lede{font-size:14px; margin-bottom:20px;}
.confirm-box{display:none; text-align:center; padding:20px 0;}
.confirm-box.open{display:block;}
.confirm-box .check{width:52px; height:52px; border-radius:50%; background:var(--teal); color:#F6F0E3; display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;}
.loading{padding:120px 32px; text-align:center; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:13px;}

@media (max-width: 900px){
  .hero-grid, .about-grid, .footer-grid, .awards-grid, .init-grid, .pub-grid, .consult-grid{grid-template-columns:1fr;}
  .video-grid{grid-template-columns:1fr;}
  .navlinks{display:none;}
  .hero-text h1{font-size:26px;}
  .events-panel{padding:28px;}
  .pos-row{grid-template-columns:1fr;}
  .contact-form .row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading…</div></div>

<div class="modal-overlay" id="bookingModal">
  <div class="modal">
    <button class="modal-close" onclick="closeBooking()" aria-label="Close">&times;</button>
    <div id="bookingForm"></div>
    <div class="confirm-box" id="bookingConfirm"></div>
  </div>
</div>

<script>
var DATA = null;
var LANG = 'en';

function esc(s){ return (s===undefined||s===null) ? '' : String(s); }

async function loadData(){
  initLangFromUrl();
  const res = await fetch('content/site.json', {cache:'no-store'});
  DATA = await res.json();
  render();
}

function render(){
  const en = LANG === 'en';
  const T = {
    nav: DATA.nav[LANG], hero: DATA.hero[LANG], about: DATA.about[LANG],
    awards: DATA.awards[LANG], init: DATA.initiatives[LANG], teach: DATA.teaching[LANG],
    pub: DATA.publications[LANG], media: DATA.media[LANG], cons: DATA.consultations[LANG],
    contact: DATA.contact[LANG], booking: DATA.booking[LANG]
  };
  document.documentElement.lang = LANG;
  document.documentElement.dir = en ? 'ltr' : 'rtl';

  const heroPhoto = DATA.site.photo
    ? '<img src="'+esc(DATA.site.photo)+'" alt="'+esc(T.nav.logoName)+'">'
    : '<div class="ph">photo</div>';

  const statsHtml = DATA.hero.stats.map(function(s){
    const inner = '<b>'+esc(s.value)+'</b><span>'+esc(en?s.labelEn:s.labelAr)+'</span>';
    return s.url
      ? '<a class="hero-stat" href="'+esc(s.url)+'" target="_blank" rel="noopener" style="text-decoration:none;">'+inner+'</a>'
      : '<div class="hero-stat">'+inner+'</div>';
  }).join('');

  const awardsHtml = DATA.awards.items.map(function(a){
    return '<div class="award-card"><span class="award-year">'+esc(a.year)+'</span><div><div class="award-title">'+esc(en?a.titleEn:a.titleAr)+'</div>'+((en?a.noteEn:a.noteAr)?'<div class="award-note">'+esc(en?a.noteEn:a.noteAr)+'</div>':'')+'</div></div>';
  }).join('');

  const initHtml = DATA.initiatives.items.map(function(i){
    return '<div class="init-card"><span class="role-tag">'+esc(en?i.tagEn:i.tagAr)+'</span><h3>'+esc(i.title)+'</h3><p>'+esc(en?i.descEn:i.descAr)+'</p></div>';
  }).join('');

  const posHtml = DATA.teaching.positions.map(function(p){
    return '<li class="pos-row"><div class="pos-dates">'+esc(p.dates)+'</div><div><div class="pos-title">'+esc(en?p.titleEn:p.titleAr)+'</div><div class="pos-org">'+esc(en?p.org:p.orgAr)+'</div><p class="pos-desc">'+esc(en?p.descEn:p.descAr)+'</p></div></li>';
  }).join('');

  const booksHtml = DATA.publications.books.map(function(b){
    return '<div class="card"><span class="tag">'+esc(en?b.tagEn:b.tagAr)+'</span><h3>'+esc(b.title)+'</h3><p class="venue">'+esc(en?b.venueEn:b.venueAr)+'</p></div>';
  }).join('');

  const artHtml = DATA.publications.articles.map(function(a){
    return '<li class="pub-row"><div><span class="p-title">'+esc(en?a.titleEn:a.titleAr)+'</span><span class="p-venue">'+esc(en?a.venueEn:a.venueAr)+'</span></div><span class="p-year">'+esc(a.year)+'</span></li>';
  }).join('');

  const arOnlyHtml = (!en && DATA.publications.arabicOnly) ? (
    '<div style="margin-top:44px;"><div class="media-sub"><h3>منشورات باللغة العربية</h3></div><ul class="pub-list">' +
    DATA.publications.arabicOnly.map(function(a){
      return '<li class="pub-row"><div><span class="p-title">'+esc(a.title)+'</span>'+(a.venue?'<span class="p-venue">'+esc(a.venue)+'</span>':'')+'</div><span class="p-year">'+esc(a.year)+'</span></li>';
    }).join('') + '</ul></div>'
  ) : '';

  const videosHtml = DATA.media.videos.map(function(v){
    const thumb = v.thumbnail ? '<img src="'+esc(v.thumbnail)+'">' : '';
    return '<a href="'+esc(v.url)+'" class="video-card" target="_blank" rel="noopener"><div class="video-thumb">'+thumb+'<div class="play"></div></div><h4>'+esc(en?v.titleEn:v.titleAr)+'</h4><p class="meta">'+esc(v.meta)+'</p></a>';
  }).join('');

  const linksMap = [
    {label:{en:'YouTube channel',ar:'قناة يوتيوب'}, url: DATA.site.socialLinks.youtube},
    {label:{en:'LinkedIn',ar:'لينكدإن'}, url: DATA.site.socialLinks.linkedin},
    {label:{en:'Google Scholar',ar:'Google Scholar'}, url: DATA.site.socialLinks.scholar},
    {label:{en:'Scopus',ar:'Scopus'}, url: DATA.site.socialLinks.scopus},
    {label:{en:'ORCID',ar:'ORCID'}, url: DATA.site.socialLinks.orcid}
  ];
  const elsewhereHtml = linksMap.map(function(l){
    return '<a href="'+esc(l.url)+'" class="chip" target="_blank" rel="noopener"><span class="dot"></span>'+esc(en?l.label.en:l.label.ar)+'</a>';
  }).join('');

  const consultCardsHtml = DATA.consultations.cards.map(function(c){
    return '<div class="consult-card"><h4>'+esc(en?c.titleEn:c.titleAr)+'</h4></div>';
  }).join('');

  const html = `
  <header>
    <nav>
      <a href="#top" class="logo">${esc(T.nav.logoName)}<span>${esc(T.nav.logoTag)}</span></a>
      <ul class="navlinks">
        <li><a href="#about">${esc(T.nav.about)}</a></li>
        <li><a href="#awards">${esc(T.nav.awards)}</a></li>
        <li><a href="#initiatives">${esc(T.nav.initiatives)}</a></li>
        <li><a href="#teaching">${esc(T.nav.teaching)}</a></li>
        <li><a href="#publications">${esc(T.nav.publications)}</a></li>
        <li><a href="#media">${esc(T.nav.media)}</a></li>
        <li><a href="#consultations">${esc(T.nav.consultations)}</a></li>
        <li><button class="btn btn-primary" onclick="openBooking()">${esc(T.nav.bookBtn)}</button></li>
        <li class="langswitch">
          <button id="btn-en" class="${en?'active':''}" onclick="setLang('en')">EN</button>
          <button id="btn-ar" class="${!en?'active':''}" onclick="setLang('ar')">AR</button>
        </li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap"><div class="hero-panel"><div class="hero-grid">
        <div class="hero-photo-wrap"><div class="hero-photo">${heroPhoto}</div></div>
        <div class="hero-text">
          <p class="eyebrow">${esc(T.hero.eyebrow)}</p>
          <h1>${esc(T.hero.h1)}</h1>
          <p class="lede">${esc(T.hero.lede)}</p>
          <div class="hero-stats">${statsHtml}</div>
          <div class="hero-ctas">
            <button class="btn btn-primary" onclick="openBooking()">${esc(T.hero.ctaPrimary)}</button>
            <a href="#publications" class="btn btn-ghost">${esc(T.hero.ctaGhost)}</a>
          </div>
        </div>
      </div></div></div>
    </section>

    <section id="about">
      <div class="wrap about-grid">
        <div><p class="eyebrow">${esc(T.about ? (en?DATA.awards.en.eyebrow:'') : '')}</p></div>
      </div>
    </section>

    <section id="about2" style="display:none"></section>
  </main>
  `;

  document.getElementById('app').innerHTML = html;

  // second pass: build remaining sections (kept separate for readability)
  const main = document.getElementById('app').querySelector('main');
  const aboutSection = document.getElementById('about');
  aboutSection.innerHTML = `
    <div class="wrap about-grid">
      <div>
        <p class="eyebrow">${en?DATA.awards.en.eyebrow.replace('Awards & honors','About'):'نبذة'}</p>
        <h2>${esc(T.about.h2)}</h2>
      </div>
      <div>
        <p class="lede" style="font-size:16px;">${esc(T.about.p1)}</p>
        <p class="pull">"${esc(T.about.quote)}"</p>
        <p class="lede" style="font-size:16px;">${esc(T.about.p2)}</p>
        <ul class="creds">
          <li><b>${en?'Ph.D.':'دكتوراه'}</b> ${esc(en?DATA.about.credEducation.en.replace('Ph.D. ',''):DATA.about.credEducation.ar.replace('دكتوراه ',''))}</li>
          <li><b>${en?'Based in':'مقيمة في'}</b> ${esc(DATA.site.based)}</li>
          <li><b>${en?'Email':'البريد الإلكتروني'}</b> <a href="mailto:${esc(DATA.site.email)}">${esc(DATA.site.email)}</a></li>
          <li><b>${en?'Profiles':'الصفحات'}</b> <a href="${esc(DATA.site.socialLinks.scholar)}" target="_blank" rel="noopener">Google Scholar</a> &middot; <a href="${esc(DATA.site.socialLinks.scopus)}" target="_blank" rel="noopener">Scopus</a> &middot; <a href="${esc(DATA.site.socialLinks.orcid)}" target="_blank" rel="noopener">ORCID</a> &middot; <a href="${esc(DATA.site.socialLinks.linkedin)}" target="_blank" rel="noopener">LinkedIn</a></li>
        </ul>
      </div>
    </div>
  `;

  const rest = document.createElement('div');
  rest.innerHTML = `
    <section id="awards" style="background:var(--paper-alt);">
      <div class="wrap">
        <div class="section-head"><div><p class="eyebrow">${esc(T.awards.eyebrow)}</p><h2>${esc(T.awards.h2)}</h2></div></div>
        <div class="awards-grid">${awardsHtml}</div>
      </div>
    </section>

    <section id="initiatives">
      <div class="wrap">
        <div class="section-head"><div><p class="eyebrow">${esc(T.init.eyebrow)}</p><h2>${esc(T.init.h2)}</h2></div></div>
        <div class="init-grid">${initHtml}</div>
      </div>
    </section>

    <section id="teaching" style="background:var(--paper-alt);">
      <div class="wrap">
        <div class="section-head"><div><p class="eyebrow">${esc(T.teach.eyebrow)}</p><h2>${esc(T.teach.h2)}</h2></div></div>
        <ul class="pos-list">${posHtml}</ul>
        <div class="training-stat">
          <div><b>${esc(DATA.teaching.trainingStat.value)}</b><span>${esc(en?DATA.teaching.trainingStat.labelEn:DATA.teaching.trainingStat.labelAr)}</span></div>
          <span style="color:#C9DCD5; font-size:14.5px; max-width:46ch;">${esc(en?DATA.teaching.trainingStat.noteEn:DATA.teaching.trainingStat.noteAr)}</span>
        </div>
      </div>
    </section>

    <section id="publications">
      <div class="wrap">
        <div class="section-head">
          <div><p class="eyebrow">${esc(T.pub.eyebrow)}</p><h2>${esc(T.pub.h2)}</h2></div>
          <a href="${esc(DATA.site.socialLinks.scholar)}" target="_blank" rel="noopener" class="btn btn-ghost">${esc(T.pub.scholarLink)}</a>
        </div>
        <div class="pub-grid">${booksHtml}</div>
        <ul class="pub-list">${artHtml}</ul>
        ${arOnlyHtml}
      </div>
    </section>

    <section id="media" style="background:var(--paper-alt);">
      <div class="wrap">
        <div class="section-head"><div><p class="eyebrow">${esc(T.media.eyebrow)}</p><h2>${esc(T.media.h2)}</h2></div></div>
        <div class="video-grid">${videosHtml}</div>
        <div class="media-sub"><h3>${esc(T.media.elseSub)}</h3></div>
        <div class="elsewhere">${elsewhereHtml}</div>
      </div>
    </section>

    <section id="consultations">
      <div class="wrap">
        <div class="events-panel">
          <p class="eyebrow" style="color:#9FC2B7;">${esc(T.cons.eyebrow)}</p>
          <h2>${esc(T.cons.h2)}</h2>
          <p class="lede">${esc(T.cons.lede)}</p>
          <div class="consult-grid">${consultCardsHtml}</div>
          <div class="book-cta">
            <div><h3 style="color:#F6F0E3; font-size:20px;">${esc(T.cons.ctaTitle)}</h3><p>${esc(T.cons.ctaDesc)}</p></div>
            <button class="btn btn-primary" style="background:var(--gold); color:#241a06;" onclick="openBooking()">${esc(T.cons.ctaBtn)}</button>
          </div>
        </div>
      </div>
    </section>

    <footer id="contact">
      <div class="wrap footer-grid">
        <div>
          <p class="eyebrow">${esc(T.contact.eyebrow)}</p>
          <h2 style="font-size:28px; margin:10px 0 16px;">${esc(T.contact.h2)}</h2>
          <p class="lede" style="margin-bottom:24px;">${esc(T.contact.lede)}</p>
          <form class="contact-form" onsubmit="return handleContactSubmit(event)">
            <div class="row"><input type="text" placeholder="${en?'Your name':'الاسم'}" required><input type="email" placeholder="you@email.com" required></div>
            <textarea placeholder="${en?"What's this about?":'ما موضوع رسالتك؟'}" required></textarea>
            <button type="submit" class="btn btn-primary" style="justify-self:start;">${en?'Send message':'إرسال الرسالة'}</button>
          </form>
          <div class="social-row">
            <a href="${esc(DATA.site.socialLinks.youtube)}" target="_blank" rel="noopener">${en?'YouTube':'يوتيوب'}</a>
            <a href="${esc(DATA.site.socialLinks.linkedin)}" target="_blank" rel="noopener">${en?'LinkedIn':'لينكدإن'}</a>
            <a href="${esc(DATA.site.socialLinks.scholar)}" target="_blank" rel="noopener">Google Scholar</a>
            <a href="mailto:${esc(DATA.site.email)}">${en?'Email':'البريد الإلكتروني'}</a>
          </div>
        </div>
        <div>
          <p class="eyebrow">${en?'Details':'التفاصيل'}</p>
          <div class="creds" style="margin-top:14px;">
            <div><b>${en?'Email':'البريد الإلكتروني'}</b> ${esc(DATA.site.email)}</div>
            <div><b>${en?'Based in':'مقيمة في'}</b> ${esc(DATA.site.based)}</div>
            <div><b>${en?'Affiliation':'الانتماء'}</b> ${esc(DATA.site.affiliation)}</div>
          </div>
          <p class="marginalia" style="margin-top:26px;"><span class="arrow">&#8618;</span>${esc(T.contact.note)}</p>
        </div>
      </div>
      <div class="wrap footer-bottom">
        <span>${esc(T.contact.copyright)}</span>
        <span>${esc(T.contact.tagline)}</span>
      </div>
    </footer>
  `;
  main.appendChild(rest);

  // booking modal content
  document.getElementById('bookingForm').innerHTML = `
    <h3>${esc(T.booking.title)}</h3>
    <p class="lede">${esc(T.booking.lede)}</p>
    <form class="contact-form" onsubmit="return handleBookingSubmit(event)">
      <div class="row"><input type="text" placeholder="${en?'Your name':'الاسم'}" required><input type="email" placeholder="you@email.com" required></div>
      <div class="row"><input type="text" placeholder="${en?'Organization':'الجهة / المؤسسة'}" required><input type="date" required></div>
      <textarea placeholder="${en?'What would you like to talk about?':'ما الذي تودّين مناقشته؟'}" required></textarea>
      <button type="submit" class="btn btn-primary" style="justify-self:start;">${en?'Request appointment':'إرسال طلب الحجز'}</button>
    </form>
  `;
  document.getElementById('bookingConfirm').innerHTML = `
    <div class="check">&#10003;</div>
    <h3>${esc(T.booking.confirmTitle)}</h3>
    <p class="lede" style="margin:0 auto;">${esc(T.booking.confirmLede)}</p>
    <button class="btn btn-ghost" style="margin-top:20px;" onclick="closeBooking()">${esc(T.booking.closeBtn)}</button>
  `;
}

function setLang(l){
  LANG = l;
  const url = new URL(window.location.href);
  url.searchParams.set('lang', l);
  window.history.replaceState(null, '', url.toString());
  render();
}
function initLangFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const l = params.get('lang');
  if (l === 'ar' || l === 'en') LANG = l;
}
function openBooking(){
  document.getElementById('bookingForm').style.display = 'block';
  document.getElementById('bookingConfirm').classList.remove('open');
  document.getElementById('bookingModal').classList.add('open');
}
function closeBooking(){ document.getElementById('bookingModal').classList.remove('open'); }
function handleBookingSubmit(e){
  e.preventDefault();
  document.getElementById('bookingForm').style.display = 'none';
  document.getElementById('bookingConfirm').classList.add('open');
  return false;
}
function handleContactSubmit(e){
  e.preventDefault();
  alert(LANG==='ar' ? "شكرًا! هذا النموذج التجريبي غير مرتبط ببريد إلكتروني بعد." : "Thanks! This demo form isn't wired to an inbox yet.");
  e.target.reset();
  return false;
}
document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'bookingModal') closeBooking();
});

loadData();
</script>

</body>
</html>
